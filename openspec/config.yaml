# OpenSpec SDD configuration — MCP-PTB
# Generated by the SDD init executor. Machine-read by SDD phases.
# Do not edit unless you are intentionally changing project SDD policy.

project: MCP-PTB
version: 0.1.0
description: >-
  MCP server for Cisco Packet Tracer zero-config automation via a PTBuilder
  bridge (WebSocket live mode + .pkt script fallback), with auto-layout,
  device/module/link catalogs, a 12-client TUI installer, and composite tools.

# ---------------------------------------------------------------------------
# SDD policy
# ---------------------------------------------------------------------------
artifact_store: openspec        # Specifications live under openspec/ (this dir)
strict_tdd: true                # Red-Green-Refactor; no impl without failing test
review_budget_lines: 400        # Review gate threshold for delivery decisions
delivery_strategy: ask-on-risk  # Pause and ask on size/scope/risk gates
chain_strategy: deferred        # Chaining decided only when needed

# ---------------------------------------------------------------------------
# Project context (stack and conventions)
# ---------------------------------------------------------------------------
stack:
  language: typescript
  module: NodeNext
  runtime: node (>=18; verified on 24.x)
  test_framework: vitest
  ui_framework: none (vanilla DOM in ui-less TUI/clients)
  key_dependencies:
    - "@modelcontextprotocol/sdk"
    - zod
    - ws
    - "@clack/prompts"
  dev_dependencies:
    - vitest
    - typescript
    - tsx

architecture_manifest: AGENTS.md # Reigning micro-modularity contract (1 file = 1 unit)

source_layout:
  src:
    bridge:   # PTBuilder bridge adapter, live mode, script builder (ports/adapters)
    catalogs: # device / module / link / interface catalogs (pure data)
    layout:   # auto-layout algorithm (pure logic)
    server:   # MCP server wiring
    tools:    # primitive + composite use cases (1 action per module)
    tui:      # 12-client installer, detection, configuration
    types:    # shared protocol types
  tests:   # mirrors src; vitest include pattern tests/**/*.test.ts
  pt-extension: # PTBuilder packet tracer extension source (bridge client)

# ---------------------------------------------------------------------------
# Testing runner details (authoritative for all phases)
# ---------------------------------------------------------------------------
test:
  command: npm test             # -> vitest run (verified green: 125 tests, 10 files)
  single_file: npx vitest run <file>
  watch_command: npm run test:watch
  coverage_command: npm run test:coverage # vitest --coverage (v8 provider)
  include: ["tests/**/*.test.ts"]
  globals: true
  config_file: vitest.config.ts
  setup_file: tests/setup.ts

tdd:
  mode: strict
  practice: red-green-refactor
  per_phase_green: true # Phase complete only when full suite is green
  rules:
    - Write the failing test first; observe it fail (red)
    - Implement the minimal unit to make it pass (green)
    - Refactor only while keeping the suite green
    - Tests live in tests/ mirroring src/ paths
    - generate (no hand-crafted fixtures when a pure function exists)

# ---------------------------------------------------------------------------
# Phase rules (contract -> architecture -> test spec -> implementation -> review)
# ---------------------------------------------------------------------------
phases:
  contract:
    artifacts:
      - openspec/contract.md # goals, scope, success criteria
    rules:
      - Define acceptance criteria before any implementation
      - Scope must fit the review budget or trigger ask-on-risk

  architecture:
    artifacts:
      - openspec/architecture.md
    rules:
      - Every design decision must satisfy AGENTS.md micro-modularity (no god
        components/services, no generic utils.js, 1 file = 1 function/case)
      - Composability over monoliths; views -> organisms -> molecules -> atoms
      - Use cases remain ports-driven (traits/adapters separation)

  test-spec:
    artifacts:
      - openspec/test-plan.md or per-feature spec files
    rules:
      - Enumerate test cases per unit before implementation
      - Strict TDD: test list is the acceptance contract

  implementation:
    rules:
      - One failing test at a time; suite must stay green after each unit
      - Micro-modular modules only, per source_layout
      - No network/HTTP inside atoms or molecules (UI isolation rules apply
        to TUI/clients as well)

  review:
    rules:
      - Gate: full suite green via npm test before review
      - Gate: npm run build (tsc) compiles clean
      - "Budget: changes <= 400 lines; otherwise pause via ask-on-risk (never infer size exceptions blindly)"
      - "Correction workflow: forecast lines -> apply fix -> validate -> close review before editing further (AGENTS.md section 6.1)"